name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: Android app bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Android permission parity (OnSpace / Expo contract)
        run: bun run parity
      - name: Build app bundle
        run: bun run build:node
      - name: Verify bundle output
        run: |
          test -f dist/server/index.mjs
          test -f dist/client/manifest.webmanifest
          echo "android app bundle ok"
      - name: Start server and health check
        run: |
          bun run start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            bun run healthcheck && break
            sleep 1
          done
          kill $SERVER_PID
        env:
          PORT: 3000

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: butler-nexus-android-bundle
          path: dist
          retention-days: 7
